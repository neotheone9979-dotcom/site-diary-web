<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shim.js"></script>
</head>
<body>
<title>Act Masters Site Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column; navy header with project and date, content in the middle, five-tab bar fixed at the bottom; forms open as bottom sheets. */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#13213a; --muted:#5a6680; --line:#d6dce6; --chip:#e6ebf3;
  --navy:#1d3a6b; --hdr:#1d3a6b; --hdr-ink:#ffffff; --hdr-muted:#b9c7de;
  --flame:#df631a; --flame-ink:#ffffff; --flame-soft:#fbe6d8;
  --good:#1d7a48; --good-soft:#dcf0e4; --warn:#a86300; --warn-soft:#f8ead2; --bad:#bf3328; --bad-soft:#f8dedb;
  --shadow:0 1px 2px rgba(19,33,58,.08);
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c121b; --card:#141c28; --ink:#e6ebf3; --muted:#97a3b8; --line:#243044; --chip:#1d2737;
    --navy:#94b3ea; --hdr:#111a27; --hdr-ink:#e6ebf3; --hdr-muted:#8fa0bb;
    --flame:#ff8a3d; --flame-ink:#1c0b02; --flame-soft:#3a2214;
    --good:#53c389; --good-soft:#15301f; --warn:#f0b34f; --warn-soft:#33270f; --bad:#ff6d60; --bad-soft:#3a1a17;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c121b; --card:#141c28; --ink:#e6ebf3; --muted:#97a3b8; --line:#243044; --chip:#1d2737;
  --navy:#94b3ea; --hdr:#111a27; --hdr-ink:#e6ebf3; --hdr-muted:#8fa0bb;
  --flame:#ff8a3d; --flame-ink:#1c0b02; --flame-soft:#3a2214;
  --good:#53c389; --good-soft:#15301f; --warn:#f0b34f; --warn-soft:#33270f; --bad:#ff6d60; --bad-soft:#3a1a17;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink)}
.hdr .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{background:#fff;border-radius:7px;padding:3px 6px;display:flex;flex:0 0 auto}
.logo img{height:26px;width:auto;display:block}
.hsel{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.hsel label{font:600 10px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--hdr-muted)}
.hsel select{background:transparent;border:0;color:var(--hdr-ink);font:700 16px/1.2 var(--display);font-stretch:85%;padding:0;max-width:100%;text-overflow:ellipsis}
.hsel select option{color:#13213a;background:#fff}
.hdate{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;color:var(--hdr-ink);padding:6px 8px;font:500 13px var(--mono);max-width:148px}
.hdate::-webkit-calendar-picker-indicator{filter:invert(1)}

/* Main */
main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0;gap:0}
.card.flush>.ch{padding:12px 14px 8px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:800 24px/1.15 var(--display);font-stretch:80%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font:700 17px/1.25 var(--display);font-stretch:88%;margin:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1 1 auto}

/* Progress hero */
.hero .big{display:flex;align-items:baseline;gap:8px}
.hero .pct{font:700 44px/1 var(--mono);letter-spacing:-.03em;color:var(--ink)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--chip);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--flame)}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.bar.thin{height:6px}
.bar.thin>i{background:var(--navy)}
.bar.thin.done>i{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .k1{width:12px;height:6px;border-radius:3px;background:var(--flame)}
.legend .k2{width:2px;height:12px;background:var(--ink)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--muted)}
.tile .v{font:600 24px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile .s{font-size:12px}

/* Chips and pills */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 12px var(--body);background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.flame{background:var(--flame-soft);color:var(--flame)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.alert::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.alert.bad::before{background:var(--bad)}
.alert.good::before{background:var(--good)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
button.li{cursor:pointer}
button.li:hover{background:var(--chip)}
.li .main{flex:1 1 auto;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .r{flex:0 0 auto;text-align:right}
.stage{display:flex;flex-direction:column;gap:5px;padding:10px 14px;border-top:1px solid var(--line)}
.stage .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stage .top .num{font-weight:600}
.empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:14px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--flame);border-color:var(--flame);color:var(--flame-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--card)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1 1 0;border:0;background:none;border-radius:8px;padding:8px 6px;font:600 14px var(--body);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mark{display:flex;gap:4px;flex:0 0 auto}
.mark button{width:38px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:700 13px var(--mono);cursor:pointer;color:var(--muted)}
.mark button[data-v="P"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--card)}
.mark button[data-v="H"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--card)}
.mark button[data-v="A"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--card)}
.ot{width:56px;flex:0 0 auto;text-align:center;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:500 13px var(--mono)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--muted)}
.in,.f input,.f select,.f textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:400 15px var(--body)}
.f textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.task input[type="checkbox"]{width:22px;height:22px;margin-top:1px;accent-color:var(--good);flex:0 0 auto}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .main{flex:1 1 auto;min-width:0}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:6px}
.x:hover{color:var(--bad);background:var(--chip)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.pre{white-space:pre-line;overflow-wrap:anywhere}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.tb th{font-weight:600;color:var(--muted);background:var(--chip)}
table.tb td.n,table.tb th.n{text-align:right;font-family:var(--mono)}
table.tb tr:last-child td{border-bottom:0}
.wl{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.wl .in,.wl input,.wl select{background:var(--card)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--body);color:var(--muted);cursor:pointer;min-width:0}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--flame)}

/* Sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92%;border-radius:16px 16px 0 0;background:var(--card);color:var(--ink);display:flex;flex-direction:column}
dialog.sheet:not([open]){display:none}
dialog.sheet::backdrop{background:rgba(8,14,24,.5)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h3{flex:1 1 auto;min-width:0}
.sh-b{overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:16px;max-height:86%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.state{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.state p{margin:0;color:var(--muted);max-width:42ch}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.seg button,.mark button{transition:background .12s,border-color .12s,color .12s}.bar>i{transition:width .4s}}

.ico{stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ico .s{fill:var(--chip)}.ico .a{fill:var(--flame-soft);stroke:var(--flame)}.ico .r{fill:var(--flame);stroke:var(--flame)}.ico .w{fill:var(--card)}
.thumb{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .chip{border:0;cursor:pointer;font-size:13px;padding:6px 11px}
.chips .chip.on{background:var(--navy);color:var(--card)}
.catl{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ci .cm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ci .t{font-weight:600;font-size:14px}
.cls{display:flex;flex-direction:column;gap:4px;width:100%}
.cl{display:flex;align-items:center;gap:8px;width:100%}
.cz{flex:0 0 auto;min-width:76px;font:500 13px var(--mono);color:var(--muted)}
.cq{width:88px;flex:0 0 auto;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:500 14px var(--mono);text-align:right;color:var(--ink)}
.catf{position:sticky;bottom:0;background:var(--card);padding:10px 0 2px;box-shadow:0 -8px 12px -8px rgba(0,0,0,.15)}
.seg4 button{font-size:13px;padding:7px 3px;line-height:1.2}
</style>

<header class="hdr gut">
  <div class="wrap">
    <div class="logo"><img id="logo" alt="Act Masters"></div>
    <div class="hsel"><label for="projSel">Project</label><select id="projSel"><option>Loading…</option></select></div>
    <input type="date" id="dateSel" class="hdate" aria-label="Date">
  </div>
</header>

<main class="gut"><div class="wrap" id="view">
  <div class="card state"><h3>Opening your site diary…</h3><p>Projects, attendance, plans, daily reports and stores load here.</p></div>
</div></main>

<nav class="nav" aria-label="Sections"><div class="wrap gut" style="padding-left:0;padding-right:0">
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Overview</button>
  <button type="button" data-tab="att"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 11l2 2 4-4"/></svg>Attendance</button>
  <button type="button" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4"/><path d="M8 12l2 2 4-4"/><path d="M8 17h8"/></svg>Plan</button>
  <button type="button" data-tab="dpr"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>Daily report</button>
  <button type="button" data-tab="store"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>Stores</button>
</div></nav>

<dialog class="sheet" id="sheet"><div class="sh-h"><h3 id="shT"></h3><button type="button" class="x" id="shX" aria-label="Close">×</button></div><div class="sh-b" id="shB"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function weekStart(s){var d=pd(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);}
function fd(s,wd){if(!s)return '';var d=pd(s);return (wd?WD[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]+(wd?'':' '+String(d.getFullYear()).slice(2));}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function n(v){var x=Number(v);return isFinite(x)?x:0;}
function fq(v){return Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function opts(list,sel){return list.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>';}).join('');}

function toast(m){var t=$('#toast'),host=$('#sheet').open?$('#sheet'):document.body;if(t.parentNode!==host)host.appendChild(t);t.textContent=m;t.hidden=!m;clearTimeout(tt);if(m)tt=setTimeout(function(){t.hidden=true;},3200);}
function fail(e){
  var c=e&&e.code;
  toast(c==='invalid_argument'||c==='not_granted'?'You can view this project but not record entries. Ask the owner for edit access.':
    c==='quota_exceeded'?'Storage is full. Ask the owner to clear old records.':
    c==='resource_exhausted'?'Too many saves at once. Wait a moment and try again.':'Not saved. Check your connection and try again.');
}
function proj(){return S.projects.filter(function(p){return p.id===S.pid;})[0]||null;}
function col(c){return S.db.collection('projects/'+S.pid+'/'+c);}
function put(c,id,data){return col(c).doc(id).set(data).catch(function(e){fail(e);throw e;});}
function stamp(o){o.by=S.me||'';o.at=new Date().toISOString();return o;}
function nameOf(id){return S.names[id]||'';}
function wantNames(ids){
  if(!S.user||!S.user.profiles)return;
  ids=ids.filter(function(i){return i&&!(i in S.names);});
  if(!ids.length)return;
  ids.forEach(function(i){S.names[i]='';});
  S.user.profiles(ids).then(function(ps){ids.forEach(function(i){S.names[i]=(ps[i]&&ps[i].name)||'Someone';});render();},function(){});
}

/* ---------- progress maths ---------- */
function overall(p){
  var st=p.stages||[],w=0,s=0;
  st.forEach(function(x){var k=n(x.weight)||0;w+=k;s+=k*Math.min(100,n(x.pct));});
  return w?Math.round(s/w):0;
}
function timePct(p){
  if(!p.start||!p.end)return null;
  var tot=daysBetween(p.start,p.end);if(tot<=0)return null;
  var el=daysBetween(p.start,today());
  return Math.max(0,Math.min(100,Math.round(el/tot*100)));
}
function attCount(date){
  var a=S.att[date],c={P:0,H:0,A:0,ot:0};
  if(!a)return null;
  Object.keys(a.marks||{}).forEach(function(k){var v=a.marks[k];if(c[v]!=null)c[v]++;});
  Object.keys(a.ot||{}).forEach(function(k){c.ot+=n(a.ot[k]);});
  return c;
}
function planOf(kind,date){var key=kind==='week'?weekStart(date):date;return S.plans[kind+'_'+key]||{kind:kind,key:key,items:[]};}
function planStat(pl){var t=(pl.items||[]).length,d=(pl.items||[]).filter(function(i){return i.done;}).length;return {t:t,d:d};}
function activeWorkers(){return S.workers.filter(function(w){return w.active!==false;}).sort(function(a,b){return (a.trade||'').localeCompare(b.trade||'')||(a.name||'').localeCompare(b.name||'');});}
function stageName(p,id){var s=(p.stages||[]).filter(function(x){return x.id===id;})[0];return s?s.name:'';}

/* ---------- data ---------- */
function boot(){
  $('#logo').src=LOGO;
  $('#dateSel').value=S.date;
  if(!window.claude||typeof window.claude.use!=='function'){S.mode='off';render();return;}
  window.claude.use('downloads').then(function(d){S.dl=d;render();},function(){});
  window.claude.use('user').then(function(u){
    S.user=u;if(!u)return;
    (u.id?u.id():Promise.resolve(null)).then(function(id){S.me=id||'';},function(){});
  },function(){});
  var timer=setTimeout(function(){if(S.mode==='connecting'){S.mode='slow';render();}},10000);
  window.claude.use('db').then(function(db){
    if(!db){clearTimeout(timer);S.mode='off';render();return;}
    S.db=db;
    db.collection('projects').limit(200).onSnapshot(function(snap){
      clearTimeout(timer);
      S.projects=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;}).sort(function(a,b){return (a.closed?1:0)-(b.closed?1:0)||(a.name||'').localeCompare(b.name||'');});
      if(S.mode!=='ready'&&!snap.metadata.fromCache)S.mode='ready';
      if(S.mode==='connecting'||S.mode==='slow')S.mode=S.projects.length||!snap.metadata.fromCache?'ready':S.mode;
      if(!proj()&&S.projects.length){var open=S.projects.filter(function(p){return !p.closed;})[0];S.pid=(open||S.projects[0]).id;}
      if(!S.projects.length)S.pid=null;
      fillProj();watchProject();render();
    },function(e){clearTimeout(timer);S.mode=e&&e.code==='revoked'?'off':'error';render();});
  },function(){clearTimeout(timer);S.mode='off';render();});
}
var watching=null;
function watchProject(){
  if(watching===S.pid)return;
  S.unsub.forEach(function(u){try{u();}catch(e){}});S.unsub=[];
  watching=S.pid;
  S.workers=[];S.adv=[];S.att={};S.plans={};S.dpr={};S.tools=[];S.mats=[];S.mtx=[];S.tlog=[];S.loaded={};
  if(!S.pid)return;
  function sub(name,q,fn){
    S.unsub.push(q.onSnapshot(function(snap){
      var rows=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
      fn(rows);S.loaded[name]=true;soft();
    },function(e){S.loaded[name]=true;if(e&&e.code!=='revoked')toast('Some records could not load. Pull down or reopen the page to retry.');soft();}));
  }
  function byId(rows){var m={};rows.forEach(function(r){m[r.id]=r;});return m;}
  sub('workers',col('workers').limit(500),function(r){S.workers=r;});
  sub('adv',col('adv').orderBy('date','desc').limit(1000),function(r){S.adv=r;});
  sub('att',col('att').orderBy('date','desc').limit(100),function(r){S.att=byId(r);});
  sub('plans',col('plans').orderBy('key','desc').limit(80),function(r){S.plans=byId(r);});
  sub('dpr',col('dpr').orderBy('date','desc').limit(400),function(r){S.dpr=byId(r);});
  sub('tools',col('tools').limit(1000),function(r){S.tools=r;});
  sub('mats',col('mats').limit(1000),function(r){S.mats=r;});
  sub('mtx',col('mtx').orderBy('at','desc').limit(300),function(r){S.mtx=r;});
  sub('tlog',col('tlog').orderBy('at','desc').limit(200),function(r){S.tlog=r;});
}
function fillProj(){
  var sel=$('#projSel'),o='';
  if(!S.projects.length)o='<option value="">No projects yet</option>';
  var open=S.projects.filter(function(p){return !p.closed;}),closed=S.projects.filter(function(p){return p.closed;});
  o+=open.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('');
  if(closed.length)o+='<optgroup label="Completed">'+closed.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('')+'</optgroup>';
  if(S.db)o+='<option value="__new">+ New project</option>';
  sel.innerHTML=o;sel.value=S.pid||'';
}
$('#projSel').addEventListener('change',function(e){
  if(e.target.value==='__new'){e.target.value=S.pid||'';projectSheet(null);return;}
  S.pid=e.target.value;saveUi();watchProject();render();
});
$('#dateSel').addEventListener('change',function(e){if(e.target.value){S.date=e.target.value;render();}});

/* ---------- rendering ---------- */
var deferred=false;
function soft(){
  var a=document.activeElement;
  if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'){deferred=true;return;}
  render();
}
$('#view').addEventListener('focusout',function(){if(deferred){setTimeout(function(){var a=document.activeElement;if(!(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){deferred=false;render();}},0);}});

function render(){
  deferred=false;
  $$('.nav button').forEach(function(b){if(b.getAttribute('data-tab')===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('#dateSel').hidden=S.tab==='home'||S.tab==='store';
  var v=$('#view'),h;
  if(S.mode==='off')h=stateCard('Sign in to use the site diary',window.AndroidBridge?'Close and reopen the app to sign in again.':'Records are shared with your team, so the diary needs you signed in to Claude. Open this page in the Claude app or at claude.ai while signed in.');
  else if(S.mode==='error')h=stateCard('The diary can’t be reached','Check your connection and reopen the page. Nothing you saved before is lost.');
  else if(S.mode==='connecting'&&!S.projects.length)h=stateCard('Opening your site diary…','Projects, attendance, plans, daily reports and stores load here.');
  else if(S.mode==='slow'&&!S.projects.length)h=stateCard('Still connecting…','The diary is taking longer than usual. Check your connection. Your projects appear here as soon as it answers.');
  else if(!S.projects.length)h=firstRun();
  else if(!proj())h=stateCard('Pick a project','Choose a project at the top.');
  else h={home:vHome,att:vAtt,plan:vPlan,dpr:vDpr,store:vStore}[S.tab]();
  v.innerHTML=h;
  if(S.tab==='store'&&proj())drawStoreList();
}

function dprText(p,r,date){
  var c=attCount(date),L=['*Daily Progress Report*','*'+p.name+'*'+(p.site?' – '+p.site:''),'Date: '+fd(date,true)+' '+pd(date).getFullYear()+(r.weather?' | Weather: '+r.weather:''),
    'Manpower: '+(r.manpower!=null?r.manpower:'–')+(c?' (P '+c.P+', H '+c.H+(c.ot?', OT '+c.ot+' h':'')+')':'')];
  if(r.subLabour)L.push('Subcontractor labour: '+r.subLabour);
  L.push('','*Work done*');
  (r.work||[]).forEach(function(w,i){L.push((i+1)+'. '+actLabel(w)+(w.qty!==''&&w.qty!=null?' – '+fq(w.qty)+' '+(w.unit||''):'')+(w.stage?' ['+stageName(p,w.stage)+(w.pct!==''&&w.pct!=null?' '+n(w.pct)+'%':'')+']':''));});
  var u=usedOn(date);if(u.length){L.push('','*Material used*');u.forEach(function(x){L.push('- '+x.name+': '+fq(x.qty)+' '+x.unit);});}

  for(var r=0;r<Math.min(15,rows.length);r++){if(rows[r].some(function(c){return hnorm(c)===first;})){hi=r;break;}}

}

      byPlan[k].forEach(function(d){if(have[lc(d.text)])return;have[lc(d.text)]=1;pl.items.push({id:uid(),text:d.text,stage:d.stage,qty:d.qty,unit:d.unit,who:d.who,done:false});});
      stamp(pl);tasks.push(function(){return col('plans').doc(k).set(pl);});
    });

  }

/* ---------- salary, PF, ESIC, advances and CTC ---------- */
var PAYDEF={pfEe:12,pfEr:13,capOn:true,cap:15000,esiEe:0.75,esiEr:3.25,esiLim:21000,days:26};
function payCfg(){var p=proj()||{};return Object.assign({},PAYDEF,p.pay||{});}
function wPay(w){
  w=w||{};
  var old=w.basic==null&&w.rate!=null&&w.rate!=='';
  var basis=w.basis||(old?'day':'month');
  return {basis:basis,basic:w.basic!=null&&w.basic!==''?n(w.basic):(old?n(w.rate):0),allow:n(w.allow),
    ctc:w.ctc===''||w.ctc==null?'':n(w.ctc),pf:w.pf!==false,esi:w.esi!==false};
}
/* f = share of the full month earned (1 = full month). Daily rates count C.days days as a month. */
function calcPay(q,C,f){
  if(f==null)f=1;
  var mult=q.basis==='day'?C.days:1,bF=q.basic*mult,aF=q.allow*mult,gF=bF+aF;
  var b=Math.round(bF*f),a=Math.round(aF*f),g=b+a;
  var pfw=q.pf?(C.capOn?Math.min(b,C.cap):b):0;
  var pfEe=Math.round(pfw*C.pfEe/100),pfEr=Math.round(pfw*C.pfEr/100);
  var esiOn=q.esi&&gF>0&&gF<=C.esiLim;
  var esiEe=esiOn?Math.ceil(g*C.esiEe/100):0,esiEr=esiOn?Math.ceil(g*C.esiEr/100):0;
  return {basic:b,allow:a,gross:g,grossFull:gF,pfEe:pfEe,pfEr:pfEr,esiOn:esiOn,esiEe:esiEe,esiEr:esiEr,ctc:g+pfEr+esiEr,net:g-pfEe-esiEe};
}
/* Largest allowance that keeps the calculated CTC at or under the agreed CTC. null = basic alone is over. */
function fitAllow(q,C){
  var T=n(q.ctc);if(!T)return null;
  var mult=q.basis==='day'?C.days:1,bF=q.basic*mult;
  var pfw=q.pf?(C.capOn?Math.min(bF,C.cap):bF):0,pfEr=Math.round(pfw*C.pfEr/100);
  if(T-pfEr<bF)return null;
  var g1=(T-pfEr)/(1+C.esiEr/100),g=(q.esi&&g1<=C.esiLim)?g1:T-pfEr;
  var step=q.basis==='day'?0.01:1,al=Math.floor((g-bF)/mult/step)*step,t=Object.assign({},q);
  for(var i=0;i<400;i++){t.allow=al;if(calcPay(t,C).ctc<=T||al<=0)break;al=Math.round((al-step)*100)/100;}
  t.allow=Math.max(0,al);
  if(calcPay(t,C).ctc>T)return null;
  return Math.round(t.allow*100)/100;
}
function rs(v){return '₹ '+Number(Math.round(n(v))).toLocaleString('en-IN');}
function ctcStatus(q,c){
  if(q.ctc===''||!q.ctc)return ['','No CTC set'];
  var d=q.ctc-c.ctc;
  if(d<0)return ['bad','Over CTC by '+rs(-d)];
  if(d<1)return ['good','Matches CTC'];
  return ['flame',rs(d)+' left for allowances'];
}

function salaryRows(m){

    Object.keys(a.marks||{}).forEach(function(id){var v=a.marks[id];days[id]=(days[id]||0)+(v==='P'?1:v==='H'?0.5:0);});
    Object.keys(a.ot||{}).forEach(function(id){ot[id]=(ot[id]||0)+n(a.ot[id]);});});
  S.adv.forEach(function(a){if(monthOf(a.date)===m)adv[a.wid]=(adv[a.wid]||0)+n(a.amt);});
  return S.workers.filter(function(w){return w.active!==false||days[w.id]||adv[w.id];}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(w){
    var q=wPay(w),d=days[w.id]||0,f=q.basis==='day'?d/C.days:Math.min(d,C.days)/C.days,c=calcPay(q,C,f),ad=adv[w.id]||0;

  });

/* photos: resized on the phone so each stays small */
function resizeImg(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    function go(max,qual){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',qual);}
    var d=go(320,0.72);if(d.length>90000)d=go(220,0.6);cb(d);
  };im.onerror=function(){toast('That file isn’t a picture this device can read.');};im.src=fr.result;};
  fr.readAsDataURL(file);
}

}
function guessAct(t){
  var s=lc(t),R=[[/paint/,'paint'],[/weld/,'weld'],[/bend/,'bend'],[/support/,'supp'],[/wrap|coat/,'wrap'],[/pump panel|panel/,'panel'],[/pump/,'pump'],[/sprinkler/,'spr'],[/alarm|detector|call point|hooter/,'fa'],[/valve|fitting/,'fit'],[/erect|lay|laying|pipe/,'erect']];
  for(var i=0;i<R.length;i++)if(R[i][0].test(s))return R[i][1];
  return '';
}
function workTotals(){
  var m=monthOf(today()),T={};
  Object.keys(S.dpr).forEach(function(k){(S.dpr[k].work||[]).forEach(function(w){
    if(!w.act||w.act==='other'||w.qty===''||w.qty==null)return;
    var key=w.act+'|'+(w.unit||'');var t=T[key]||(T[key]={act:w.act,unit:w.unit||'',all:0,mon:0,last:''});
    t.all+=n(w.qty);if(k.slice(0,7)===m)t.mon+=n(w.qty);if(k>t.last)t.last=k;
  });});
  return ACTS.map(function(a){return Object.keys(T).filter(function(k){return T[k].act===a[0];}).map(function(k){return T[k];});}).reduce(function(x,y){return x.concat(y);},[]);
}
function workTotalsCard(){
  var R=workTotals();
  var h='<section class="card flush"><div class="ch"><h2>Work done to date</h2><span class="small muted">From daily reports</span></div>';
  if(!R.length)return h+'<div class="empty">Choose an activity on each work line of the daily report, and totals build up here.</div></section>';
  return h+'<div class="tw" style="border:0;border-radius:0"><table class="tb"><thead><tr><th>Activity</th><th class="n">'+MON[new Date().getMonth()]+'</th><th class="n">To date</th></tr></thead><tbody>'+
    R.map(function(r){return '<tr><td style="white-space:normal">'+esc(ACTMAP[r.act].l)+'</td><td class="n">'+(r.mon?fq(r.mon)+' '+esc(r.unit):'–')+'</td><td class="n"><b>'+fq(r.all)+'</b> '+esc(r.unit)+'</td></tr>';}).join('')+'</tbody></table></div></section>';
}

/* ---------- downloads ---------- */
function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');}
function safe(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,' ').trim();}
function dl(name,text){
  if(!S.dl){toast('Downloads aren’t available here.');return;}
  S.dl.save({filename:name,data:text}).then(function(r){toast('Saved '+name+(typeof r==='string'&&r?' in '+r:''));},function(e){toast(e&&e.code==='declined'?'Download cancelled':'The file could not be saved here.');});
}
function exportAtt(){
  var m=S.date.slice(0,7),y=+m.slice(0,4),mo=+m.slice(5,7),last=new Date(y,mo,0).getDate(),days=[];
  for(var i=1;i<=last;i++)days.push(m+'-'+pad(i));
  var ws=S.workers.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  var rows=[['Name','Trade','Contractor'].concat(days.map(function(d){return d.slice(8);})).concat(['Days','OT hours'])];
  ws.forEach(function(w){
    var t=0,ot=0,any=false,r=[w.name,w.trade||'',w.contractor||''];
    days.forEach(function(d){var a=S.att[d],v=a&&a.marks?a.marks[w.id]||'':'';if(v)any=true;if(v==='P')t+=1;if(v==='H')t+=0.5;if(a&&a.ot&&a.ot[w.id])ot+=n(a.ot[w.id]);r.push(v);});
    if(any||w.active!==false)rows.push(r.concat([t,ot]));
  });
  dl('Attendance '+safe(proj().name)+' '+MON[mo-1]+' '+y+'.csv',csv(rows));
}
function exportStock(){
  var rows=[['Material','Type','Unit','In stock','Minimum','Received','Issued','BOQ qty']];
  S.mats.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).forEach(function(m){rows.push([m.name,m.cat==='core'?'Core material':'Consumable',m.unit,m.stock,m.min,m.received,m.issued,m.boq]);});
  dl('Stock '+safe(proj().name)+' '+today()+'.csv',csv(rows));
}
function exportTools(){
  var rows=[['Name','Type','Code','Qty','Status','With','Condition','Ownership','Hired from','Hire rate per day','Hired until']];
  S.tools.forEach(function(x){rows.push([x.name,x.kind==='machine'?'Machine':'Tool',x.code,x.qty,(TSTAT[x.status||'available']||TSTAT.available)[0],x.holder,x.cond,x.own==='hired'?'Hired':'Own',x.vendor,x.hireRate,x.hireTill]);});
  dl('Tools and machinery '+safe(proj().name)+' '+today()+'.csv',csv(rows));
}
function exportSummary(){
  var p=proj(),rows=[['Project',p.name],['Client',p.client||''],['Site',p.site||''],['Overall progress %',overall(p)],['Time used %',timePct(p)==null?'':timePct(p)],[''],['Stage','Weight','% done','Last updated']];
  (p.stages||[]).forEach(function(s){rows.push([s.name,s.weight,s.pct,s.updated||'']);});
  rows.push([''],['Daily reports','Manpower','Work items','Hindrances']);
  Object.keys(S.dpr).sort().reverse().forEach(function(k){var r=S.dpr[k];rows.push([k,r.manpower,(r.work||[]).map(function(w){return actLabel(w)+(w.qty!==''&&w.qty!=null?' ('+w.qty+' '+(w.unit||'')+')':'');}).join('; '),r.hindrance||'']);});
  dl('Progress summary '+safe(p.name)+' '+today()+'.csv',csv(rows));
}

/* ---------- events ---------- */
document.querySelector('.nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.getAttribute('data-tab');S.q='';saveUi();render();window.scrollTo(0,0);});
$('#view').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),p=proj();
  if(a==='go'){var t=b.getAttribute('data-tab');if(t==='planw'){S.tab='plan';S.planKind='week';}else{S.tab=t;if(t==='plan')S.planKind='day';}if(t==='att'||t==='dpr'||t==='plan'||t==='planw'){S.date=today();$('#dateSel').value=S.date;}saveUi();render();window.scrollTo(0,0);}
  else if(a==='newProject')projectSheet(null);
  else if(a==='editProject')projectSheet(p);
  else if(a==='stages')stagesSheet();
  else if(a==='openDpr'){S.date=b.getAttribute('data-d');$('#dateSel').value=S.date;S.tab='dpr';saveUi();render();window.scrollTo(0,0);}
  else if(a==='mark'){var id=b.getAttribute('data-id'),v=b.getAttribute('data-v');writeAtt(function(x){if(x.marks[id]===v)delete x.marks[id];else x.marks[id]=v;});}
  else if(a==='allP'){writeAtt(function(x){activeWorkers().forEach(function(w){if(!x.marks[w.id])x.marks[w.id]='P';});});}
  else if(a==='addWorker')workerSheet(null);
  else if(a==='editWorker')workerSheet(S.workers.filter(function(w){return w.id===b.getAttribute('data-id');})[0]);
  else if(a==='register')registerSheet();
  else if(a==='exportAtt')exportAtt();
  else if(a==='pk'){S.planKind=b.getAttribute('data-v');saveUi();render();}
  else if(a==='delTask'){var i=+b.getAttribute('data-i'),pl=planOf(S.planKind,S.date);writePlan(S.planKind,pl.key,function(x){x.items.splice(i,1);});}
  else if(a==='carry'){
    var k=S.planKind,key=k==='week'?weekStart(S.date):S.date,prevKey=k==='week'?addDays(key,-7):addDays(S.date,-1),left=(planOf(k,prevKey).items||[]).filter(function(i){return !i.done;});
    writePlan(k,key,function(x){var have={};x.items.forEach(function(i){have[i.text]=1;});left.forEach(function(i){if(!have[i.text])x.items.push(Object.assign({},i,{id:uid(),done:false}));});});
    toast(left.length+' task'+(left.length>1?'s':'')+' brought over');
  }
  else if(a==='pull'){var wk=planOf('week',S.date),it=(wk.items||[]).filter(function(i){return i.id===b.getAttribute('data-id');})[0];if(it)writePlan('day',S.date,function(x){x.items.push(Object.assign({},it,{id:uid(),done:false,from:'week'}));});}
  else if(a==='dprEdit')dprSheet();
  else if(a==='dprCopy'){
    var text=dprText(p,S.dpr[S.date],S.date);
    if(window.AndroidBridge&&window.AndroidBridge.shareText){window.AndroidBridge.shareText(text);return;}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast('Copied. Paste it into WhatsApp or email.');},function(){copyFallback(text);});else copyFallback(text);
  }
  else if(a==='sk'){S.store=b.getAttribute('data-v');S.q='';saveUi();render();}
  else if(a==='mc'){S.matCat=b.getAttribute('data-v');render();}
  else if(a==='tf'){S.toolF=b.getAttribute('data-v');render();}
  else if(a==='addMat')matSheet(null);
  else if(a==='addTool')toolSheet(null);
  else if(a==='exportStock')exportStock();
  else if(a==='exportTools')exportTools();
  else if(a==='exportSummary')exportSummary();
  else if(a==='bulk')bulkSheet();
  else if(a==='atab'){S.attTab=b.getAttribute('data-v');render();window.scrollTo(0,0);}
  else if(a==='editPay')paySheet(S.workers.filter(function(w){return w.id===b.getAttribute('data-id');})[0]);
  else if(a==='payCfg')payCfgSheet();
  else if(a==='exportSal')exportSal();
  else if(a==='catMat')catalogSheet('mat');
  else if(a==='catTool')catalogSheet('tool');
  else if(a==='delAdv'){var aid=b.getAttribute('data-id');confirmBtn(b,'Delete?',function(){col('adv').doc(aid).delete().then(function(){toast('Advance deleted');},fail);});}
});
$('#view').addEventListener('click',function(e){
  var b=e.target.closest('[data-act="openMat"],[data-act="openTool"]');if(!b)return;
  var id=b.getAttribute('data-id');
  if(b.getAttribute('data-act')==='openMat')matSheet(S.mats.filter(function(m){return m.id===id;})[0]);
  else toolSheet(S.tools.filter(function(x){return x.id===id;})[0]);
});
$('#view').addEventListener('change',function(e){
  var t=e.target,a=t.getAttribute('data-act');
  if(a==='tick'){var i=+t.getAttribute('data-i'),pl=planOf(S.planKind,S.date);writePlan(S.planKind,pl.key,function(x){x.items[i].done=t.checked;x.items[i].doneOn=t.checked?today():'';});}
  else if(a==='ot'){var id=t.getAttribute('data-id'),v=t.value===''?0:Number(t.value);writeAtt(function(x){if(v>0)x.ot[id]=v;else delete x.ot[id];});}
});
$('#view').addEventListener('input',function(e){if(e.target.id==='storeQ'){S.q=e.target.value;drawStoreList();}});
$('#view').addEventListener('submit',function(e){
  if(e.target.id==='advForm'){e.preventDefault();
    var wid=val('av-w'),amt=n(val('av-a'));if(!wid){toast('Choose the worker.');return;}if(amt<=0){toast('Enter the amount.');return;}
    put('adv',uid(),stamp({wid:wid,amt:amt,date:val('av-d')||S.date,mode:val('av-m'),note:val('av-n')})).then(function(){toast('Advance recorded');$('#av-a').value='';$('#av-n').value='';},function(){});
    return;}
  if(e.target.id!=='taskForm')return;e.preventDefault();
  var text=val('tf-text');if(!text)return;
  var it={id:uid(),text:text,stage:val('tf-stage'),qty:numv('tf-qty'),unit:val('tf-unit'),who:val('tf-who'),done:false};
  var pl=planOf(S.planKind,S.date);
  writePlan(S.planKind,pl.key,function(x){x.items.push(it);});
  setTimeout(function(){var el=$('#tf-text');if(el)el.focus();},0);
});
function copyFallback(text){
  sheet('Copy the report','<div class="small muted">Copying was blocked here. Select the text below and copy it.</div><textarea class="in" id="cpy" rows="14" readonly>'+esc(text)+'</textarea>',function(){var t=$('#cpy');t.focus();t.select();});
}

window.__sdFail=fail;
window.__sdBack=function(){
  var d=$('#sheet');if(d.open){closeSheet();return true;}
  if(S.tab!=='home'){S.tab='home';saveUi();render();window.scrollTo(0,0);return true;}
  return false;
};
$('#view').addEventListener('click',function(e){
  var b=e.target.closest('[data-act="signOut"]');if(!b||!window.SD_NATIVE)return;
  confirmBtn(b,'Tap again to sign out',function(){window.SD_NATIVE.signOut();});
});
boot();
render();
})();
</script>
